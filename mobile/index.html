<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Shopping - Search & Add Items</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-stone-200 font-sans flex justify-center items-center min-h-screen p-0 sm:p-4">

  <!-- Mobile Frame Mockup -->
  <div class="w-full max-w-md bg-white rounded-none sm:rounded-[40px] shadow-2xl overflow-hidden border-0 sm:border-8 sm:border-gray-900 min-h-[844px] flex flex-col relative">

    <!-- Top Status Bar Mockup -->
    <div class="pt-3 px-6 flex justify-between items-center text-xs font-semibold text-gray-900 bg-white">
      <span>9:41</span>
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-signal"></i>
        <i class="fa-solid fa-wifi"></i>
        <i class="fa-solid fa-battery-full text-sm"></i>
      </div>
    </div>

    <!-- User Header Section -->
    <div class="px-6 pt-4 pb-2 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-full bg-gray-950 text-white flex items-center justify-center font-bold text-xs shadow-md">
          UN
        </div>
        <div>
          <p class="text-[10px] text-gray-400 font-semibold tracking-wider uppercase">Welcome back</p>
          <h2 class="text-xs font-bold text-gray-900 flex items-center gap-1">
            Uzziah Nyimbili <i class="fa-solid fa-circle-check text-gray-900 text-[10px]"></i>
          </h2>
          <p class="text-[10px] text-gray-500"><i class="fa-solid fa-location-dot text-gray-900"></i> Ndola, Copperbelt</p>
        </div>
      </div>
      <button class="relative w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center text-gray-800 hover:bg-gray-200">
        <i class="fa-regular fa-bell text-xs"></i>
        <span class="absolute top-2 right-2 w-2 h-2 bg-gray-900 rounded-full"></span>
      </button>
    </div>

    <!-- Scrollable Main Content -->
    <div class="flex-1 overflow-y-auto px-6 pt-2 pb-24 space-y-5">

      <!-- Monochromatic Dark Hero Card (Exact Reference Styling) -->
      <div class="bg-gray-950 text-white rounded-3xl p-5 shadow-xl relative overflow-hidden">
        <div class="flex justify-between items-start">
          <div>
            <p class="text-[11px] text-gray-400 font-medium">Target Budget</p>
            <div class="flex items-baseline space-x-2 mt-1">
              <span class="text-2xl font-bold tracking-tight">ZMW 1,200.00</span>
              <i class="fa-regular fa-eye text-xs text-gray-400 cursor-pointer"></i>
            </div>
          </div>
          <button class="bg-white text-gray-950 text-xs font-bold px-3 py-1.5 rounded-full shadow hover:bg-gray-200 transition">
            Top Up
          </button>
        </div>

        <div class="grid grid-cols-2 gap-3 mt-5">
          <button class="bg-white text-gray-950 font-bold py-2.5 px-3 rounded-2xl flex items-center justify-center text-xs space-x-2 hover:bg-gray-200 transition shadow">
            <i class="fa-solid fa-plus text-xs"></i>
            <span>New Item</span>
          </button>
          <button class="bg-gray-800 text-white font-semibold py-2.5 px-3 rounded-2xl flex items-center justify-center text-xs space-x-2 border border-gray-700 hover:bg-gray-700 transition">
            <i class="fa-solid fa-list-check text-xs"></i>
            <span>Track Budget</span>
          </button>
        </div>
      </div>

      <!-- Product Search Bar -->
      <div class="flex items-center space-x-2">
        <div class="flex-1 bg-gray-100 rounded-2xl flex items-center px-4 py-3 space-x-2 text-xs text-gray-500 border border-transparent focus-within:border-gray-900 focus-within:bg-white transition">
          <i class="fa-solid fa-magnifying-glass text-gray-400"></i>
          <input type="text" placeholder="Search essential items (e.g., Mealimeal, Sugar)..." class="bg-transparent border-none outline-none w-full text-gray-900 placeholder-gray-400 text-xs">
        </div>
        <button class="w-11 h-11 rounded-2xl bg-gray-950 text-white flex items-center justify-center text-xs shadow-md">
          <i class="fa-solid fa-sliders"></i>
        </button>
      </div>

      <!-- Quick Search / Suggested Items -->
      <div>
        <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-2">Quick Add Essentials</p>
        <div class="flex space-x-2 overflow-x-auto pb-1 scrollbar-none">
          <button class="bg-gray-100 hover:bg-gray-200 text-gray-800 text-[11px] font-semibold px-3 py-1.5 rounded-xl whitespace-nowrap border border-gray-200 flex items-center space-x-1.5">
            <i class="fa-solid fa-plus text-[9px]"></i>
            <span>Breakfast Meal 25kg</span>
          </button>
          <button class="bg-gray-100 hover:bg-gray-200 text-gray-800 text-[11px] font-semibold px-3 py-1.5 rounded-xl whitespace-nowrap border border-gray-200 flex items-center space-x-1.5">
            <i class="fa-solid fa-plus text-[9px]"></i>
            <span>Cooking Oil 2.5L</span>
          </button>
          <button class="bg-gray-100 hover:bg-gray-200 text-gray-800 text-[11px] font-semibold px-3 py-1.5 rounded-xl whitespace-nowrap border border-gray-200 flex items-center space-x-1.5">
            <i class="fa-solid fa-plus text-[9px]"></i>
            <span>White Sugar 2kg</span>
          </button>
        </div>
      </div>

      <!-- Active Shopping Cart / List Items (Matches Reference Item Format) -->
      <div>
        <div class="flex justify-between items-center mb-3">
          <h3 class="text-xs font-bold text-gray-900 uppercase tracking-wider">Your Shopping List (3 Items)</h3>
          <span class="text-xs text-gray-400 font-medium cursor-pointer hover:text-gray-900">Clear All</span>
        </div>

        <!-- Item 1 -->
        <div class="bg-gray-50 rounded-2xl p-3.5 mb-2.5 border border-gray-200 flex justify-between items-center">
          <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gray-200 text-gray-900 flex items-center justify-center text-sm font-bold">
              <i class="fa-solid fa-wheat-awn"></i>
            </div>
            <div>
              <h4 class="text-xs font-bold text-gray-900">Breakfast Meal 25kg</h4>
              <p class="text-[10px] text-gray-400">Essential Staples • Qty: 2</p>
            </div>
          </div>
          <div class="flex items-center space-x-2">
            <button class="w-6 h-6 rounded-full bg-gray-200 text-gray-800 text-xs font-bold flex items-center justify-center">-</button>
            <span class="text-xs font-bold text-gray-900">2</span>
            <button class="w-6 h-6 rounded-full bg-gray-950 text-white text-xs font-bold flex items-center justify-center">+</button>
          </div>
        </div>

        <!-- Item 2 -->
        <div class="bg-gray-50 rounded-2xl p-3.5 mb-2.5 border border-gray-200 flex justify-between items-center">
          <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gray-200 text-gray-900 flex items-center justify-center text-sm font-bold">
              <i class="fa-solid fa-bottle-droplet"></i>
            </div>
            <div>
              <h4 class="text-xs font-bold text-gray-900">Cooking Oil 2.5L</h4>
              <p class="text-[10px] text-gray-400">Cooking Goods • Qty: 1</p>
            </div>
          </div>
          <div class="flex items-center space-x-2">
            <button class="w-6 h-6 rounded-full bg-gray-200 text-gray-800 text-xs font-bold flex items-center justify-center">-</button>
            <span class="text-xs font-bold text-gray-900">1</span>
            <button class="w-6 h-6 rounded-full bg-gray-950 text-white text-xs font-bold flex items-center justify-center">+</button>
          </div>
        </div>

        <!-- Item 3 -->
        <div class="bg-gray-50 rounded-2xl p-3.5 mb-2.5 border border-gray-200 flex justify-between items-center">
          <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gray-200 text-gray-900 flex items-center justify-center text-sm font-bold">
              <i class="fa-solid fa-cube"></i>
            </div>
            <div>
              <h4 class="text-xs font-bold text-gray-900">White Sugar 2kg</h4>
              <p class="text-[10px] text-gray-400">Pantry Items • Qty: 1</p>
            </div>
          </div>
          <div class="flex items-center space-x-2">
            <button class="w-6 h-6 rounded-full bg-gray-200 text-gray-800 text-xs font-bold flex items-center justify-center">-</button>
            <span class="text-xs font-bold text-gray-900">1</span>
            <button class="w-6 h-6 rounded-full bg-gray-950 text-white text-xs font-bold flex items-center justify-center">+</button>
          </div>
        </div>
      </div>

      <!-- Main Action Call-To-Action Button -->
      <a href="results.html" class="block w-full">
        <button class="w-full bg-gray-950 text-white font-bold py-3.5 rounded-2xl text-xs hover:bg-gray-800 transition flex items-center justify-center space-x-2 shadow-lg">
          <i class="fa-solid fa-magnifying-glass-dollar text-sm"></i>
          <span>Compare All Shops & Lowest Prices</span>
        </button>
      </a>

    </div>

    <!-- Floating Navigation Bar (Exact Reference Pill Styling) -->
    <div class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-gray-950/90 backdrop-blur-md px-5 py-2.5 rounded-full flex items-center space-x-6 shadow-2xl border border-gray-800">
      <a href="index.html" class="flex items-center space-x-2 bg-white text-gray-950 px-3.5 py-1.5 rounded-full text-xs font-bold transition">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </a>
      <a href="results.html" class="text-gray-400 hover:text-white transition">
        <i class="fa-solid fa-chart-pie text-sm"></i>
      </a>
      <a href="#" class="text-gray-400 hover:text-white transition">
        <i class="fa-solid fa-store text-sm"></i>
      </a>
      <a href="#" class="text-gray-400 hover:text-white transition">
        <i class="fa-solid fa-user text-sm"></i>
      </a>
    </div>

  </div>

</body>
</html>
